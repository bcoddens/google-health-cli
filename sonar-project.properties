# sonar.projectKey / sonar.projectName / sonar.projectVersion are intentionally
# omitted here. scripts/sonar-scan.sh reads SONAR_PROJECT_KEY / SONAR_PROJECT_NAME
# from .env (see .env.example, falling back to scripts/lib/sonar-env.sh's
# defaults) and the version from `git describe`, then passes all three to
# sonar-scanner explicitly via -D flags — so none of them can drift between
# this file, .env, and git.
sonar.sources=main.go,cmd,pkg,internal
sonar.tests=main.go,cmd,pkg,internal
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/testdata/**
sonar.go.coverage.reportPaths=reports/coverage.out
sonar.go.tests.reportPaths=reports/test-report.json
# Generated fresh by scripts/sonar-scan.sh on every run from the same
# golangci-lint config CI uses — a missing file is a WARN from the scanner,
# not a failure.
sonar.go.golangci-lint.reportPaths=reports/golangci-lint-report.xml
sonar.sourceEncoding=UTF-8
